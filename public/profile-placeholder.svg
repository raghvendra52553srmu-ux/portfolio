<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </radialGradient>
    <linearGradient id="neon-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="body-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="face-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <filter id="glow-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Background -->
  <rect width="500" height="500" rx="40" fill="url(#bg-glow)" />

  <!-- Subtle Cyber Grid -->
  <g stroke="#334155" stroke-opacity="0.25" stroke-width="1">
    <line x1="50" y1="0" x2="50" y2="500" />
    <line x1="100" y1="0" x2="100" y2="500" />
    <line x1="150" y1="0" x2="150" y2="500" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="250" y1="0" x2="250" y2="500" />
    <line x1="300" y1="0" x2="300" y2="500" />
    <line x1="350" y1="0" x2="350" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="450" y1="0" x2="450" y2="500" />
    
    <line x1="0" y1="50" x2="500" y2="50" />
    <line x1="0" y1="100" x2="500" y2="100" />
    <line x1="0" y1="150" x2="500" y2="150" />
    <line x1="0" y1="200" x2="500" y2="200" />
    <line x1="0" y1="250" x2="500" y2="250" />
    <line x1="0" y1="300" x2="500" y2="300" />
    <line x1="0" y1="350" x2="500" y2="350" />
    <line x1="0" y1="400" x2="500" y2="400" />
    <line x1="0" y1="450" x2="500" y2="450" />
  </g>

  <!-- Radial accent glow -->
  <circle cx="250" cy="220" r="160" fill="#06b6d4" opacity="0.12" filter="url(#glow-blur)" />
  <circle cx="250" cy="220" r="120" fill="#6366f1" opacity="0.1" filter="url(#glow-blur)" />

  <!-- Outer Ring -->
  <circle cx="250" cy="220" r="145" fill="none" stroke="url(#neon-ring)" stroke-width="2" stroke-dasharray="12 6" opacity="0.6"/>
  <circle cx="250" cy="220" r="135" fill="#0b1120" stroke="#1e293b" stroke-width="2" />

  <!-- Stylized Developer Silhouette & Monogram -->
  <!-- Shoulders -->
  <path d="M160 330 C160 280, 200 270, 250 270 C300 270, 340 280, 340 330 Z" fill="url(#body-grad)" opacity="0.9" />
  
  <!-- Head / Face Silhouette -->
  <circle cx="250" cy="205" r="55" fill="url(#face-grad)" opacity="0.85" />
  <path d="M210 185 C220 150, 280 150, 290 185 C295 190, 295 195, 290 195 C285 195, 280 180, 250 180 C220 180, 215 195, 210 195 Z" fill="#0f172a" />

  <!-- Code / Data brackets aesthetic around silhouette -->
  <path d="M140 190 L115 220 L140 250" stroke="#06b6d4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.8"/>
  <path d="M360 190 L385 220 L360 250" stroke="#a855f7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.8"/>

  <!-- Developer Badge / Monogram Pill -->
  <g transform="translate(150, 380)">
    <rect width="200" height="48" rx="24" fill="#0f172a" stroke="url(#neon-ring)" stroke-width="1.5" />
    <text x="100" y="29" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="16" letter-spacing="2" text-anchor="middle">RAGHVENDRA</text>
  </g>

  <!-- Top Indicator badge -->
  <g transform="translate(170, 35)">
    <rect width="160" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <circle cx="18" cy="14" r="4" fill="#10b981" />
    <text x="88" y="19" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">PROFILE READY</text>
  </g>

  <!-- Replace Photo cue at bottom -->
  <text x="250" y="465" fill="#64748b" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" text-anchor="middle">Place your photo in public/profile.jpg</text>
</svg>
